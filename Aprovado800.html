<title>Aprovado 800+ · Plataforma de Estudos ENEM</title>
<style>
  :root{
    --paper:#F4F5F9; --card:#FFFFFF; --card-2:#FBFBFE;
    --ink:#191A2C; --ink-2:#4A4C63; --ink-3:#7C7E96;
    --line:#E5E6F0; --line-2:#EDEEF6;
    --accent:#5D5FEF; --accent-soft:#ECECFE; --accent-ink:#3F41C4;
    --gold:#F2B646; --gold-soft:#FDF3DC;
    --green:#22B27E; --green-soft:#DCF4EA;
    --red:#E5484D; --red-soft:#FBE7E7;
    --shadow:0 1px 2px rgba(25,26,44,.05),0 8px 24px -12px rgba(25,26,44,.18);
    --radius:16px; --radius-s:10px;
    --sans:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    --mono:ui-monospace,"SF Mono","Cascadia Code","Roboto Mono",Menlo,monospace;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --paper:#0E0E16; --card:#191A26; --card-2:#1F202E;
      --ink:#EEEEF6; --ink-2:#B4B6CC; --ink-3:#7E809A;
      --line:#2A2B3B; --line-2:#23242F;
      --accent:#8688FF; --accent-soft:#22243E; --accent-ink:#B6B7FF;
      --gold:#F2B646; --gold-soft:#332A16;
      --green:#3AD69B; --green-soft:#12291F;
      --red:#FF6369; --red-soft:#301618;
      --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px -16px rgba(0,0,0,.7);
    }
  }
  :root[data-theme="dark"]{
    --paper:#0E0E16; --card:#191A26; --card-2:#1F202E;
    --ink:#EEEEF6; --ink-2:#B4B6CC; --ink-3:#7E809A;
    --line:#2A2B3B; --line-2:#23242F;
    --accent:#8688FF; --accent-soft:#22243E; --accent-ink:#B6B7FF;
    --gold:#F2B646; --gold-soft:#332A16;
    --green:#3AD69B; --green-soft:#12291F;
    --red:#FF6369; --red-soft:#301618;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px -16px rgba(0,0,0,.7);
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0;background:var(--paper);color:var(--ink);
    font-family:var(--sans);line-height:1.55;
    font-feature-settings:"cv02","cv03","cv04","cv11";
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,h4{margin:0;letter-spacing:-.02em;text-wrap:balance;font-weight:800}
  p{margin:0}
  a{color:var(--accent-ink);text-decoration:none}
  button{font-family:inherit}
  .num{font-variant-numeric:tabular-nums;font-family:var(--mono)}

  /* Layout shell — menu deslizante (tipo painel de configuração) em todas as telas */
  .app{min-height:100vh}
  .side{
    position:fixed;inset:0 auto 0 0;z-index:40;width:270px;max-width:86vw;
    background:var(--card);border-right:1px solid var(--line);
    padding:18px 16px;display:flex;flex-direction:column;gap:18px;overflow-y:auto;
    transform:translateX(-100%);transition:transform .25s ease;
  }
  .side.open{transform:none;box-shadow:0 0 50px rgba(0,0,0,.28)}
  .backdrop{display:none;position:fixed;inset:0;background:rgba(8,8,16,.5);z-index:35}
  .backdrop.show{display:block}
  .side-close{position:absolute;top:16px;right:14px;width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--card-2);color:var(--ink-2);font-size:15px;cursor:pointer}
  .topnav{
    display:flex;align-items:center;gap:12px;padding:11px 16px;position:sticky;top:0;z-index:30;
    background:var(--card);border-bottom:1px solid var(--line)
  }
  .topnav .topname{font-size:15px;font-weight:800;letter-spacing:-.02em}
  .iconbtn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:16px;cursor:pointer;display:grid;place-items:center;transition:border-color .14s,color .14s;flex:none}
  .iconbtn:hover{border-color:var(--accent);color:var(--accent-ink)}
  .iconbtn.wide{width:auto;padding:0 14px;gap:8px;font-size:13.5px;font-weight:600}
  .brand{display:flex;align-items:center;gap:11px;padding:0 6px}
  .logo{
    width:40px;height:40px;border-radius:11px;flex:none;
    background:linear-gradient(145deg,var(--accent),#7B4BEA);
    display:grid;place-items:center;color:#fff;font-weight:800;font-size:18px;
    box-shadow:0 6px 16px -6px var(--accent);
  }
  .brand b{font-size:15px;letter-spacing:-.02em;display:block;line-height:1.15}
  .brand span{font-size:11.5px;color:var(--ink-3);letter-spacing:.02em}
  nav{display:flex;flex-direction:column;gap:3px}
  .navlabel{font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3);font-weight:700;padding:6px 10px 3px}
  .navbtn{
    display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:10px;
    background:none;border:0;color:var(--ink-2);font-size:14px;font-weight:600;
    cursor:pointer;text-align:left;width:100%;transition:background .14s,color .14s;
  }
  .navbtn:hover{background:var(--line-2);color:var(--ink)}
  .navbtn.active{background:var(--accent-soft);color:var(--accent-ink)}
  .navbtn .ic{width:18px;text-align:center;font-size:15px;flex:none}
  .navbtn .dot{margin-left:auto;font-size:11px;color:var(--gold)}
  .side-foot{margin-top:auto;font-size:11px;color:var(--ink-3);padding:0 8px;display:flex;justify-content:space-between;align-items:center}
  .themebtn{background:var(--line-2);border:1px solid var(--line);color:var(--ink-2);width:32px;height:32px;border-radius:9px;cursor:pointer;font-size:14px}

  main{padding:22px clamp(16px,4vw,40px) 70px;max-width:1180px;margin:0 auto;width:100%}
  .topbar{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:24px}
  .topbar h1{font-size:23px}
  .topbar .sub{color:var(--ink-3);font-size:13px;margin-top:2px}
  .spacer{flex:1}
  .countdown{
    display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);
    padding:8px 14px;border-radius:12px;box-shadow:var(--shadow)
  }
  .countdown .n{font-size:22px;font-weight:800;color:var(--accent-ink)}
  .countdown small{color:var(--ink-3);font-size:11px;line-height:1.2;display:block}

  .grid{display:grid;gap:16px}
  .cards{grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
  .card{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:18px;box-shadow:var(--shadow)
  }
  .card h3{font-size:15px;margin-bottom:4px}
  .muted{color:var(--ink-3);font-size:12.5px}
  .stat{display:flex;flex-direction:column;gap:2px}
  .stat .big{font-size:30px;font-weight:800;letter-spacing:-.03em;line-height:1}
  .stat .lbl{font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);font-weight:700}
  .stat .cap{font-size:12px;color:var(--ink-2)}

  .ring-wrap{display:flex;align-items:center;gap:18px}
  .ring{position:relative;width:104px;height:104px;flex:none}
  .ring svg{transform:rotate(-90deg)}
  .ring .lbl{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
  .ring .lbl b{font-size:24px;font-weight:800;letter-spacing:-.03em}
  .ring .lbl span{font-size:10px;color:var(--ink-3);letter-spacing:.08em;text-transform:uppercase}

  .bar{height:9px;border-radius:99px;background:var(--line-2);overflow:hidden}
  .bar > i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),#7B4BEA)}
  .bar.gold > i{background:linear-gradient(90deg,var(--gold),#E89B2B)}
  .bar.green > i{background:var(--green)}

  .pill{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;padding:3px 10px;border-radius:99px;letter-spacing:.01em}
  .pill.accent{background:var(--accent-soft);color:var(--accent-ink)}
  .pill.gold{background:var(--gold-soft);color:#9A6A0E}
  .pill.green{background:var(--green-soft);color:#16805A}
  .pill.red{background:var(--red-soft);color:var(--red)}
  @media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .pill.gold{color:var(--gold)} :root:not([data-theme="light"]) .pill.green{color:var(--green)}}
  :root[data-theme="dark"] .pill.gold{color:var(--gold)} :root[data-theme="dark"] .pill.green{color:var(--green)}

  .btn{
    display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--card);
    color:var(--ink);font-size:13.5px;font-weight:600;padding:9px 15px;border-radius:10px;cursor:pointer;
    transition:transform .1s,border-color .14s,background .14s
  }
  .btn:hover{border-color:var(--accent);color:var(--accent-ink)}
  .btn:active{transform:translateY(1px)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.primary:hover{background:var(--accent-ink);color:#fff}
  .btn.ghost{background:none}
  .btn.sm{padding:6px 11px;font-size:12.5px}
  .fld{display:block;width:100%;margin-top:5px;padding:9px 12px;border:1px solid var(--line);border-radius:9px;background:var(--card-2);color:var(--ink);font-family:var(--sans);font-size:13.5px;font-weight:500}
  .fld:focus{outline:2px solid var(--accent);outline-offset:1px}
  .alt:focus-visible,.fc:focus-visible,.navbtn:focus-visible,.btn:focus-visible,.iconbtn:focus-visible,.subcard:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  .section-title{display:flex;align-items:center;gap:10px;margin:26px 0 14px}
  .section-title h2{font-size:18px}
  .section-title .line{flex:1;height:1px;background:var(--line)}

  /* Tasks / plan */
  .day{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
  .day > header{padding:13px 16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line-2);background:var(--card-2)}
  .day header b{font-size:14px}
  .task{display:flex;align-items:flex-start;gap:11px;padding:11px 16px;border-bottom:1px solid var(--line-2);cursor:pointer}
  .task:last-child{border-bottom:0}
  .task input{margin-top:3px;width:18px;height:18px;accent-color:var(--accent);flex:none;cursor:pointer}
  .task .t-main{flex:1}
  .task .t-main b{font-size:13.5px;font-weight:600;display:block;transition:color .14s}
  .task.done .t-main b{text-decoration:line-through;color:var(--ink-3)}
  .task .t-tag{font-size:11px;color:var(--ink-3)}
  .tag-chip{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:6px;letter-spacing:.02em}
  .tg-red{background:var(--gold-soft);color:#9A6A0E}
  .tg-por{background:var(--accent-soft);color:var(--accent-ink)}
  .tg-mat{background:var(--green-soft);color:#16805A}
  .tg-out{background:var(--line-2);color:var(--ink-2)}
  @media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .tg-red{color:var(--gold)} :root:not([data-theme="light"]) .tg-mat{color:var(--green)}}
  :root[data-theme="dark"] .tg-red{color:var(--gold)} :root[data-theme="dark"] .tg-mat{color:var(--green)}

  /* Cronograma slots */
  .slot{display:flex;gap:12px;align-items:center;padding:9px 15px;border-bottom:1px solid var(--line-2)}
  .slot:last-child{border-bottom:0}
  .slot .time{font-family:var(--mono);font-size:11.5px;font-weight:600;color:var(--ink-2);background:var(--line-2);padding:3px 8px;border-radius:6px;white-space:nowrap;min-width:96px;text-align:center;flex:none}
  .slot .act{flex:1;font-size:13px;font-weight:500}
  .slot .dotc{width:8px;height:8px;border-radius:99px;flex:none}
  .dc-red{background:var(--gold)}.dc-por{background:var(--accent)}.dc-mat{background:var(--green)}.dc-out{background:var(--ink-3)}
  .filedrop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-align:center;border:2px dashed var(--line);border-radius:14px;padding:28px 18px;cursor:pointer;transition:border-color .14s,background .14s}
  .filedrop:hover{border-color:var(--accent);background:var(--card-2)}
  .modeswitch{display:inline-flex;background:var(--line-2);border-radius:11px;padding:4px;gap:4px}
  .modeswitch button{border:0;background:none;padding:8px 16px;border-radius:8px;font-size:13px;font-weight:600;color:var(--ink-2);cursor:pointer}
  .modeswitch button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}

  /* Competencias */
  .comp{display:flex;gap:14px;padding:16px;border:1px solid var(--line);border-radius:var(--radius);background:var(--card);box-shadow:var(--shadow)}
  .comp .cn{width:40px;height:40px;border-radius:11px;background:var(--accent-soft);color:var(--accent-ink);font-weight:800;display:grid;place-items:center;flex:none;font-size:17px}
  .comp h4{font-size:14.5px;margin-bottom:3px}
  .comp p{font-size:13px;color:var(--ink-2)}
  .comp .pts{font-size:11px;color:var(--ink-3);margin-top:5px;font-weight:600}

  .steps{display:grid;gap:10px}
  .step{display:flex;gap:13px;align-items:flex-start;padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:var(--card)}
  .step .sn{font-family:var(--mono);font-weight:700;color:var(--accent);font-size:13px;background:var(--accent-soft);padding:2px 9px;border-radius:7px;flex:none}
  .step b{font-size:14px}
  .step p{font-size:13px;color:var(--ink-2);margin-top:2px}
  .step em{color:var(--accent-ink);font-style:normal;font-weight:600}

  /* Conteúdo programático (expansível) */
  details.conteudo{margin-top:12px;border-top:1px solid var(--line-2);padding-top:10px}
  details.conteudo>summary{cursor:pointer;font-size:12.5px;font-weight:700;color:var(--accent-ink);list-style:none;display:flex;align-items:center;gap:7px}
  details.conteudo>summary::-webkit-details-marker{display:none}
  details.conteudo>summary::before{content:"▸";transition:transform .18s;display:inline-block;font-size:11px}
  details.conteudo[open]>summary::before{transform:rotate(90deg)}
  .topiclist{margin-top:10px;display:flex;flex-direction:column;gap:9px}
  .topic{display:flex;gap:9px}
  .topic .tk{width:6px;height:6px;border-radius:99px;background:var(--accent);margin-top:6px;flex:none}
  .topic b{font-size:12.5px;display:block;line-height:1.35}
  .topic p{font-size:11.5px;color:var(--ink-2);line-height:1.45;margin-top:1px}

  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{background:var(--card);border:1px solid var(--line);border-radius:9px;padding:7px 12px;font-size:12.5px;font-weight:600;color:var(--ink-2)}

  /* Redação editor */
  .editor-wrap{display:grid;grid-template-columns:1fr 300px;gap:16px}
  textarea.essay{
    width:100%;min-height:420px;resize:vertical;border:1px solid var(--line);border-radius:12px;

/* ---------------- Helpers ---------------- */
const $=(s,el=document)=>el.querySelector(s);
const $$=(s,el=document)=>[...el.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function daysToExam(){const d=new Date(S.examDate+"T00:00:00");const now=new Date();now.setHours(0,0,0,0);return Math.max(0,Math.round((d-now)/86400000));}
function totalTasks(){return PLAN.reduce((a,d)=>a+d.tasks.length,0);}
function doneTasks(){return Object.values(S.tasks).filter(Boolean).length;}
function tagClass(t){return t==="red"?"tg-red":t==="por"?"tg-por":t==="mat"?"tg-mat":"tg-out";}
function tagName(t){return t==="red"?"Redação":t==="por"?"Português":t==="mat"?"Matemática":"Outras";}

function markStudied(){
  const today=new Date().toISOString().slice(0,10);
  if(S.lastStudy===today) return;
  const yst=new Date(Date.now()-86400000).toISOString().slice(0,10);
  S.streak = (S.lastStudy===yst)? (S.streak||0)+1 : 1;
  S.lastStudy=today; save();
}

/* ---------------- Ring ---------------- */
function ring(pct,color){
  const r=44,c=2*Math.PI*r,off=c*(1-pct/100);
  return `<svg width="104" height="104" viewBox="0 0 104 104">
    <circle cx="52" cy="52" r="${r}" fill="none" stroke="var(--line-2)" stroke-width="10"/>
    <circle cx="52" cy="52" r="${r}" fill="none" stroke="${color}" stroke-width="10" stroke-linecap="round"
      stroke-dasharray="${c}" stroke-dashoffset="${off}"/></svg>`;
}

PAGES.correcao=()=>{
  const g=S.essayGrades||[];
  const totals=g.map(x=>x.total);
  const last=g[0], best=g.length?Math.max(...totals):0, avg=g.length?Math.round(totals.reduce((a,b)=>a+b,0)/g.length):0;
  // sparkline (chronological = reverse of stored newest-first)
  const chrono=[...g].reverse();
  let spark="";
  if(chrono.length>1){
    const w=280,h=70,pad=6,max=1000;
    const pts=chrono.map((x,i)=>{
      const px=pad+i*(w-2*pad)/(chrono.length-1);
      const py=h-pad-(x.total/max)*(h-2*pad);
      return [px,py];
    });
    const line=pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");
    const area=`M${pts[0][0]} ${h-pad} `+pts.map(p=>"L"+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ")+` L${pts[pts.length-1][0]} ${h-pad} Z`;
    spark=`<svg viewBox="0 0 ${w} ${h}" width="100%" height="80" preserveAspectRatio="none" style="margin-top:6px">
      <path d="${area}" fill="var(--accent-soft)"/>
      <path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      ${pts.map(p=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3" fill="var(--accent)"/>`).join("")}
    </svg>`;
  }
  return `<div class="page">
  <div class="topbar"><div><h1>Correção de redação com IA</h1><div class="sub">Envie a foto e receba nota nas 5 competências — depois registre para ver sua evolução.</div></div></div>

         ["2","Envie aqui no chat","Mande a foto na conversa com o Claude (esta IA) junto do tema da redação."],
         ["3","Receba a nota","Você recebe 0–200 em cada competência, os erros e como melhorar."],
         ["4","Registre a evolução","Lance a nota no quadro abaixo e acompanhe sua subida até 900+."]].map(s=>`
        <div style="background:rgba(255,255,255,.14);border-radius:12px;padding:14px"><div class="num" style="font-size:22px;font-weight:800">${s[0]}</div><b style="font-size:13.5px;display:block;margin:4px 0 3px">${s[1]}</b><span style="font-size:12px;opacity:.9">${s[2]}</span></div>`).join("")}
    </div>
    <p style="font-size:12.5px;opacity:.92;margin-top:14px">⚠️ A correção é feita por mim (Claude) na conversa — a página não guarda sua redação nem envia nada sozinha. Escolha abaixo: escrever aqui ou anexar a foto.</p>
  </div>

  <div class="card" style="margin-bottom:18px">
    <div class="modeswitch" style="margin-bottom:14px">
      <button class="on" data-cmode="escrever">✍️ Escrever aqui</button>
      <button data-cmode="foto">📸 Anexar foto</button>
    </div>

    <div id="cmode-escrever">
      <label style="font-size:12px;font-weight:600;color:var(--ink-2)">Tema da redação

  </div>

  <div class="section-title"><h2>Registrar uma correção</h2><div class="line"></div></div>
  <div class="card" style="margin-bottom:18px">
    <label style="font-size:12px;font-weight:600;color:var(--ink-2)">Tema da redação
      <input id="gr-tema" class="fld" placeholder="Ex.: Saúde mental entre os jovens" /></label>
    <div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;margin-top:12px">

/* ============ Simulado infinito · Modo Jogo por níveis ============ */
const DIFF_NAME={1:"Fácil",2:"Médio",3:"Difícil",4:"Expert"};
function gameTiers(lv){
  if(lv<=1)return [1];
  if(lv===2)return [1,2];
  if(lv===3)return [2];
  if(lv===4)return [2,3];
  if(lv===5)return [3];
  if(lv===6)return [3,4];
  return [4,3]; /* Nível 7+ : predominantemente Expert */
}
function gameQCount(lv){return Math.min(4+Math.floor((lv-1)/2),8);} /* 4 → 8 questões por nível */
function levelDiffLabel(lv){const t=gameTiers(lv);return t.length>1?`${DIFF_NAME[Math.min(...t)]}–${DIFF_NAME[Math.max(...t)]}`:DIFF_NAME[t[0]];}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function prepQ(q){ /* embaralha alternativas para que a repetição não seja decorada */
  const idx=shuffle(q.alts.map((_,i)=>i));
  return {sub:q.sub,nivel:q.nivel||1,q:q.q,exp:q.exp,alts:idx.map(i=>q.alts[i]),correct:idx.indexOf(q.correct)};
}
function buildBatch(lv){
  const tiers=gameTiers(lv);
  let pool=QUESTIONS.filter(q=>tiers.includes(q.nivel||1));
  if(pool.length<3)pool=QUESTIONS.slice();
  const need=gameQCount(lv),out=[];let bag=[];
  while(out.length<need){ if(!bag.length)bag=shuffle(pool.slice()); out.push(prepQ(bag.pop())); }
  return out;
}

let GAME=null;
function newGame(){
  GAME={phase:"start",level:1,qi:0,batch:[],answered:null,lives:3,maxLives:3,score:0,combo:0,bestCombo:0,correctInLevel:0};
}
function startLevel(lv){
  GAME.level=lv;GAME.batch=buildBatch(lv);GAME.qi=0;GAME.answered=null;GAME.correctInLevel=0;GAME.phase="play";
}

function renderGame(){
  const host=$("#gameHost");if(!host)return;
  if(!GAME)newGame();
  if(GAME.phase==="start")return renderStart(host);
  if(GAME.phase==="levelup")return renderLevelUp(host);
  if(GAME.phase==="over")return renderOver(host);
  return renderPlay(host);
}

function hud(){

    <span class="hud-chip"><span class="k">Recorde</span><b class="num">${g.bestScore||0}</b></span>
  </div>`;
}

function renderPlay(host){
  const G=GAME,Q=G.batch[G.qi],total=G.batch.length;
  const answered=G.answered!==null;
  const correct=answered&&G.answered===Q.correct;
  const prog=Math.round((G.qi/total)*100);
  const last=G.qi===total-1;
  host.innerHTML=`${hud()}
    <div class="xpbar"><i style="width:${prog}%"></i></div>
    <div class="quiz-card" style="position:relative">
      ${answered&&correct&&G.combo>1?`<span class="combo-pop">+${G.lastGain} 🔥</span>`:""}
      <div class="qmeta">
        <span class="pill accent">${esc(Q.sub)}</span>
        <span><span class="diff-tag df${Q.nivel}">${DIFF_NAME[Q.nivel]}</span> &nbsp;<span class="num">Questão ${G.qi+1}/${total}</span></span>
      </div>
      <div class="qtext">${esc(Q.q)}</div>
      <div id="alts">
      ${Q.alts.map((a,i)=>{
        let cls="alt",attrs;
        if(answered){cls+=" disabled";attrs=' aria-disabled="true"';if(i===Q.correct)cls+=" correct";else if(i===G.answered)cls+=" wrong";}
        else{attrs=' role="button" tabindex="0"';}
        return `<div class="${cls}"${attrs} data-alt="${i}"><span class="letter">${"ABCDE"[i]}</span><span class="txt">${esc(a)}</span></div>`;
      }).join("")}
      </div>
      ${answered?`<div class="explain"><b>${correct?"✅ Acertou! +"+G.lastGain+" pontos":"❌ Errou — perdeu um coração. Resposta certa: "+"ABCDE"[Q.correct]}.</b> ${esc(Q.exp)}</div>`:""}
      ${answered?`<div style="display:flex;justify-content:flex-end;margin-top:16px">
        <button class="btn primary" id="gNext">${G.lives<=0?"Ver resultado →":(last?"Concluir nível ✓":"Próxima →")}</button>
      </div>`:""}
    </div>`;
  if(!answered){
    $$("#alts .alt").forEach(el=>{
      const pick=()=>answerGame(+el.dataset.alt);
      el.addEventListener("click",pick);
      el.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();pick();}});
    });
  }
  $("#gNext")?.addEventListener("click",()=>{
    if(GAME.lives<=0){GAME.phase="over";commitGame();renderGame();return;}
    if(GAME.qi>=GAME.batch.length-1){levelCleared();} else {GAME.qi++;GAME.answered=null;renderGame();}
  });
}

function answerGame(i){
  const G=GAME,Q=G.batch[G.qi];
  if(G.answered!==null)return;
  G.answered=i;
  S.quizStats.done++;
  if(i===Q.correct){
    G.combo++;G.bestCombo=Math.max(G.bestCombo,G.combo);G.correctInLevel++;
    const mult=1+Math.min(G.combo-1,5)*0.2;
    const gain=Math.round(Q.nivel*10*mult);
    G.lastGain=gain;G.score+=gain;
    S.quizStats.correct++;S.game.xp=(S.game.xp||0)+gain;
  }else{
    G.combo=0;G.lives--;G.lastGain=0;
  }
  markStudied();save();renderGame();
}

function levelCleared(){
  const G=GAME;
  const bonus=G.level*50 + (G.correctInLevel===G.batch.length?100:0); /* perfeito = +100 */
  G.score+=bonus;G.lastBonus=bonus;G.perfect=(G.correctInLevel===G.batch.length);
  S.game.xp=(S.game.xp||0)+bonus;
  if(G.lives<G.maxLives)G.lives++; /* recupera 1 coração ao passar de nível */
  commitGame();
  G.phase="levelup";save();renderGame();
}

function renderLevelUp(host){
  const G=GAME,next=G.level+1;
  host.innerHTML=`<div class="game-screen pop-in">
    <div class="emoji">${G.perfect?"🏆":"⬆️"}</div>
    <h2>Nível ${G.level} concluído!${G.perfect?" Perfeito!":""}</h2>
    <p>${G.perfect?"Você acertou tudo — bônus de +100! ":""}Prepare-se: o <b>nível ${next}</b> traz questões <b>${levelDiffLabel(next)}</b>.</p>
    <div class="stats-row">
      <div class="gs-stat"><div class="big num">${G.score}</div><div class="lbl">Pontos</div></div>
      <div class="gs-stat"><div class="big num">+${G.lastBonus}</div><div class="lbl">Bônus nível</div></div>
      <div class="gs-stat"><div class="big num">🔥${G.bestCombo}</div><div class="lbl">Maior combo</div></div>
    </div>
    <button class="btn primary" id="gCont" style="min-width:220px;justify-content:center">Ir para o nível ${next} →</button>
    <div style="margin-top:10px"><button class="btn ghost sm" id="gStop">Encerrar e salvar</button></div>
  </div>`;
  $("#gCont")?.addEventListener("click",()=>{startLevel(next);renderGame();});
  $("#gStop")?.addEventListener("click",()=>{newGame();renderGame();});
}

function renderOver(host){
  const G=GAME,g=S.game||{};
  host.innerHTML=`<div class="game-screen pop-in">
    <div class="emoji">💔</div>
    <h2>Fim de jogo</h2>
    <p>Seus corações acabaram no <b>nível ${G.level}</b>. Cada erro vira aprendizado — anote no Caderno de erros e volte mais forte!</p>
    <div class="stats-row">
      <div class="gs-stat"><div class="big num">${G.level}</div><div class="lbl">Nível alcançado</div></div>
      <div class="gs-stat"><div class="big num">${G.score}</div><div class="lbl">Pontos</div></div>
      <div class="gs-stat"><div class="big num">🔥${G.bestCombo}</div><div class="lbl">Maior combo</div></div>
    </div>
    <p class="muted" style="margin-bottom:6px">Recorde: nível <b>${g.bestLevel||1}</b> · <b>${g.bestScore||0}</b> pontos</p>
    <button class="btn primary" id="gRetry" style="min-width:200px;justify-content:center">↻ Jogar de novo</button>
    <div style="margin-top:10px"><button class="btn ghost sm" data-goto="caderno">Ir ao Caderno de erros →</button></div>
  </div>`;
  $("#gRetry")?.addEventListener("click",()=>{newGame();renderGame();});

function commitGame(){ /* grava recordes permanentes */
  const G=GAME,g=S.game;
  g.plays=(g.plays||0)+ (G.phase==="over"?1:0);
  if(G.level>(g.bestLevel||1))g.bestLevel=G.level;
  if(G.score>(g.bestScore||0))g.bestScore=G.score;
  save();
}
function renderQuiz(){renderGame();} /* compatibilidade com o roteador */

/* Pomodoro */
let pomo={mode:"foco",left:25*60,running:false,timer:null};
const POMO_MODES={foco:25*60,curta:5*60,longa:15*60};
PAGES.foco=()=>`<div class="page">
  <div class="topbar"><div><h1>Modo foco</h1><div class="sub">Técnica Pomodoro: 25 min de estudo, 5 de pausa. Cada ciclo conta para seu tempo total.</div></div></div>
  <div class="card"><div class="pomo">
    <div class="modes">
      <button class="modechip ${pomo.mode==="foco"?"active":""}" data-mode="foco">Foco · 25min</button>
      <button class="modechip ${pomo.mode==="curta"?"active":""}" data-mode="curta">Pausa · 5min</button>
      <button class="modechip ${pomo.mode==="longa"?"active":""}" data-mode="longa">Longa · 15min</button>
    </div>
    <div class="clock num" id="clock">25:00</div>
    <div style="display:flex;gap:10px">
      <button class="btn primary" id="pStart">▶ Iniciar</button>
      <button class="btn ghost" id="pReset">↺ Reiniciar</button>
    </div>
    <p class="muted" id="pStatus">Sessões concluídas hoje: <b class="num">${S.sessions||0}</b> · ${(S.focusMin/60).toFixed(1)}h no total</p>
  </div></div>
  <div class="card" style="margin-top:18px">
    <h3>🧠 Por que funciona</h3>
    <p class="muted" style="margin-top:6px">Blocos curtos e cronometrados reduzem a procrastinação e mantêm a concentração alta. Ao fim de 4 ciclos de foco, faça uma pausa longa. Sem celular durante o foco!</p>
  </div>
  </div>`;

function fmt(s){const m=Math.floor(s/60),ss=s%60;return String(m).padStart(2,"0")+":"+String(ss).padStart(2,"0");}
function pomoTick(){
  pomo.left--;
  const c=$("#clock");if(c)c.textContent=fmt(pomo.left);
  if(pomo.left<=0){
    clearInterval(pomo.timer);pomo.running=false;
    if(pomo.mode==="foco"){S.sessions=(S.sessions||0)+1;S.focusMin=(S.focusMin||0)+25;markStudied();save();}
    pomo.left=POMO_MODES[pomo.mode];
    const st=$("#pStatus");if(st)st.innerHTML=`Sessões concluídas hoje: <b class="num">${S.sessions||0}</b> · ${(S.focusMin/60).toFixed(1)}h no total`;
    const b=$("#pStart");if(b)b.textContent="▶ Iniciar";
    if(pomo.mode==="foco"){alert("⏰ Sessão de foco concluída! Faça uma pausa de 5 minutos.");}
    const cc=$("#clock");if(cc)cc.textContent=fmt(pomo.left);
  }
}
function bindPomo(){
  $$("[data-mode]").forEach(el=>el.addEventListener("click",()=>{
    clearInterval(pomo.timer);pomo.running=false;pomo.mode=el.dataset.mode;pomo.left=POMO_MODES[pomo.mode];
    render("foco");
  }));
  $("#pStart")?.addEventListener("click",()=>{
    const b=$("#pStart");
    if(pomo.running){clearInterval(pomo.timer);pomo.running=false;b.textContent="▶ Continuar";}
    else{pomo.running=true;b.textContent="⏸ Pausar";pomo.timer=setInterval(pomoTick,1000);}
  });
  $("#pReset")?.addEventListener("click",()=>{clearInterval(pomo.timer);pomo.running=false;pomo.left=POMO_MODES[pomo.mode];$("#clock").textContent=fmt(pomo.left);const b=$("#pStart");if(b)b.textContent="▶ Iniciar";});
  const c=$("#clock");if(c)c.textContent=fmt(pomo.left);
}

/* ---------------- Router / binding ---------------- */
let current="dash";
function render(page){
  current=page;
  $("#main").innerHTML=PAGES[page]();
  const navMatch=page==="materia"?"materias":page;
  $$("#nav .navbtn").forEach(b=>b.classList.toggle("active",b.dataset.page===navMatch));
  window.scrollTo(0,0);
  bindPage(page);
}
function openSubject(id){currentSubject=id;render("materia");closeMenu();}
function bindPage(page){
  $$("[data-goto]").forEach(el=>el.addEventListener("click",()=>{go(el.dataset.goto);}));
  $$("[data-sub]").forEach(el=>el.addEventListener("click",()=>openSubject(el.dataset.sub)));

  if(page==="plano"){
    $$("[data-task]").forEach(el=>el.addEventListener("change",e=>{
      const id=el.dataset.task;S.tasks[id]=$("input",el).checked;
      el.classList.toggle("done",S.tasks[id]);
      if(S.tasks[id])markStudied();
      save();
      const dt=doneTasks(),tt=totalTasks();
      $(".bar i")&&($(".bar i").style.width=dt/tt*100+"%");
      $(".meter .num")&&($(".meter .num").textContent=dt+"/"+tt);
    }));
    $("#resetPlan")?.addEventListener("click",()=>{if(confirm("Zerar todas as tarefas da semana?")){S.tasks={};save();render("plano");}});
  }

  if(page==="redacao"){
    const ta=$("#essay");
    ta?.addEventListener("input",()=>{
      S.essay=ta.value;markStudied();save();
      const words=ta.value.trim()?ta.value.trim().split(/\s+/).length:0;
      const lines=ta.value?ta.value.split("\n").filter(l=>l.trim()).length:0;
      const bars=$$(".meterbox .bar i");
      if(bars[0])bars[0].style.width=Math.min(100,lines/30*100)+"%";
      if(bars[1])bars[1].style.width=Math.min(100,words/300*100)+"%";
      const nums=$$(".meterbox .meter .num b");
      if(nums[0])nums[0].textContent=lines;if(nums[1])nums[1].textContent=words;
    });
    $$("[data-chk]").forEach(el=>el.addEventListener("change",()=>{
      S.essayCheck[el.dataset.chk]=el.checked;save();
      const chk=CHECKLIST.filter((_,i)=>S.essayCheck[i]).length;
      const h=$("#checklist").previousElementSibling.querySelector(".num");if(h)h.textContent=chk+"/"+CHECKLIST.length;
    }));
    $("#clearEssay")?.addEventListener("click",()=>{if(confirm("Limpar o rascunho?")){S.essay="";save();render("redacao");}});
  }

  if(page==="materia"){
    $$("[data-flip]").forEach(el=>{
      const flip=()=>el.classList.toggle("flip");
      el.addEventListener("click",flip);
      el.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();flip();}});
    });
  }
  if(page==="correcao"){
    // alternar modo escrever / foto
    $$("[data-cmode]").forEach(el=>el.addEventListener("click",()=>{
      const m=el.dataset.cmode;
      $$("[data-cmode]").forEach(b=>b.classList.toggle("on",b===el));
      $("#cmode-escrever").classList.toggle("hidden",m!=="escrever");
      $("#cmode-foto").classList.toggle("hidden",m!=="foto");
    }));
    // escrever na plataforma (compartilha S.essay com a aba Redação)
    const cta=$("#ci-essay"), ctema=$("#ci-tema");
    function ciCount(){
      const v=cta?cta.value:"";
      const lines=v?v.split("\n").filter(l=>l.trim()).length:0;
      const words=v.trim()?v.trim().split(/\s+/).length:0;
      const L=$("#ci-lines"),W=$("#ci-words");if(L)L.textContent=lines;if(W)W.textContent=words;
    }
    ciCount();
    cta?.addEventListener("input",()=>{S.essay=cta.value;markStudied();save();ciCount();});
    ctema?.addEventListener("input",()=>{S.essayTema=ctema.value;save();});
    $("#ci-copy")?.addEventListener("click",async()=>{
      const txt=(ctema&&ctema.value.trim()?"Tema: "+ctema.value.trim()+"\n\n":"")+(cta?cta.value:"");
      if(!cta||!cta.value.trim()){alert("Escreva a redação primeiro 🙂");return;}
      const full="Corrija minha redação do ENEM pelas 5 competências (0 a 200 cada) e me diga como melhorar:\n\n"+txt;
      try{await navigator.clipboard.writeText(full);}catch(e){const t=document.createElement("textarea");t.value=full;document.body.appendChild(t);t.select();document.execCommand("copy");t.remove();}
      const b=$("#ci-copy");const o=b.textContent;b.textContent="✅ Copiado! Cole no chat";setTimeout(()=>b.textContent=o,2500);
    });
    // anexar foto (prévia local, sem enviar nada)
    const file=$("#ci-file"),prev=$("#ci-preview"),empty=$("#ci-drop-empty"),ok=$("#ci-photo-ok");
    file?.addEventListener("change",()=>{
      const f=file.files&&file.files[0];if(!f)return;
      const url=URL.createObjectURL(f);
      prev.src=url;prev.style.display="block";if(empty)empty.style.display="none";ok?.classList.remove("hidden");
    });
    $("#ci-file-change")?.addEventListener("click",()=>file.click());
    // registrar nota
    $("#gr-add")?.addEventListener("click",()=>{
      const scores=[0,1,2,3,4].map(i=>+$("#gr-c"+i).value);
      const total=scores.reduce((a,b)=>a+b,0);
      S.essayGrades=S.essayGrades||[];
      S.essayGrades.unshift({tema:$("#gr-tema").value.trim(),scores,total,date:new Date().toLocaleDateString("pt-BR")});
      markStudied();save();render("correcao");
    });
    $$("[data-gdel]").forEach(el=>el.addEventListener("click",()=>{
      S.essayGrades.splice(+el.dataset.gdel,1);save();render("correcao");
    }));
  }
  if(page==="cronogramas"){
    $$("[data-mode]").forEach(el=>el.addEventListener("click",()=>{
      S.schedMode=el.dataset.mode;save();render("cronogramas");
    }));
  }
  if(page==="caderno"){
    $("#er-add")?.addEventListener("click",()=>{
      const assunto=$("#er-assunto").value.trim();
      if(!assunto){$("#er-assunto").focus();return;}
      S.errorLog=S.errorLog||[];
      S.errorLog.unshift({
        assunto,tipo:$("#er-tipo").value,
        resolver:$("#er-resolver").value.trim(),
        lembrar:$("#er-lembrar").value.trim(),
        date:new Date().toLocaleDateString("pt-BR")
      });
      markStudied();save();render("caderno");
    });
    $$("[data-del]").forEach(el=>el.addEventListener("click",()=>{
      S.errorLog.splice(+el.dataset.del,1);save();render("caderno");
    }));
  }
  if(page==="simulado"){renderQuiz();}
  if(page==="foco"){bindPomo();}
}
function go(page){
  render(page);
  $("#side").classList.remove("open");$("#backdrop").classList.remove("show");
}

/* Nav + menu deslizante */
function openMenu(){$("#side").classList.add("open");$("#backdrop").classList.add("show");}
function closeMenu(){$("#side").classList.remove("open");$("#backdrop").classList.remove("show");}
$$("#nav .navbtn").forEach(b=>b.addEventListener("click",()=>go(b.dataset.page)));
$("#menu")?.addEventListener("click",()=>{$("#side").classList.contains("open")?closeMenu():openMenu();});
$("#sideClose")?.addEventListener("click",closeMenu);
$("#backdrop")?.addEventListener("click",closeMenu);
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeMenu();});

/* Tela cheia */
const fsEl=document.documentElement;
function fsActive(){return document.fullscreenElement||document.webkitFullscreenElement;}
function updateFsBtn(){const b=$("#fs");if(b)b.textContent=fsActive()?"⤢":"⛶";}
$("#fs")?.addEventListener("click",()=>{
  const req=fsEl.requestFullscreen||fsEl.webkitRequestFullscreen;
  const exit=document.exitFullscreen||document.webkitExitFullscreen;
  if(!req){alert("📱 Para tela cheia total no iPhone, use o botão “⤓ Salvar como app” e abra pelo ícone na tela inicial — ele abre sem a barra do navegador.");return;}
  if(fsActive()){exit.call(document);}else{req.call(fsEl).catch(()=>{});}
});
document.addEventListener("fullscreenchange",updateFsBtn);
document.addEventListener("webkitfullscreenchange",updateFsBtn);

/* Theme */
function applyTheme(t){if(t)document.documentElement.setAttribute("data-theme",t);}
let theme=localStorage.getItem("enem_theme")||"";
applyTheme(theme);
$("#theme").addEventListener("click",()=>{
  const cur=document.documentElement.getAttribute("data-theme");
  const dark=cur?cur==="dark":matchMedia("(prefers-color-scheme:dark)").matches;
  theme=dark?"light":"dark";applyTheme(theme);localStorage.setItem("enem_theme",theme);
});

/* Backup — exportar / importar progresso */
$("#exportData")?.addEventListener("click",()=>{
  const payload={app:"Aprovado800",version:1,exportedAt:new Date().toISOString(),theme:localStorage.getItem("enem_theme")||"",data:S};
  const blob=new Blob([JSON.stringify(payload,null,2)],{type:"application/json"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;a.download="aprovado800-backup-"+new Date().toISOString().slice(0,10)+".json";
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
});
$("#importData")?.addEventListener("click",()=>$("#importFile")?.click());
$("#importFile")?.addEventListener("change",e=>{
  const f=e.target.files&&e.target.files[0];if(!f)return;
  const rd=new FileReader();
  rd.onload=()=>{
    try{
      const parsed=JSON.parse(rd.result);
      const data=parsed&&parsed.data?parsed.data:parsed;
      if(!data||typeof data!=="object")throw new Error("Formato inválido");
      if(!confirm("Restaurar este backup? Isso substitui o progresso atual neste navegador.")){e.target.value="";return;}
      S=Object.assign({},DEFAULT,data);
      if(!S.game||typeof S.game!=="object")S.game={bestLevel:1,bestScore:0,xp:0,plays:0};
      else S.game=Object.assign({bestLevel:1,bestScore:0,xp:0,plays:0},S.game);
      save();
      if(parsed&&parsed.theme){localStorage.setItem("enem_theme",parsed.theme);applyTheme(parsed.theme);}
      render(current);closeMenu();
      alert("✅ Backup restaurado com sucesso!");
    }catch(err){alert("❌ Não consegui ler este arquivo. Use o JSON exportado pelo próprio app.");}
    finally{e.target.value="";}
  };
  rd.readAsText(f);
});

/* Instalar / salvar como app */
let deferredPrompt=null;
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferredPrompt=e;});
$("#install")?.addEventListener("click",async()=>{
  if(deferredPrompt){deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;return;}
  const ua=navigator.userAgent||"";
  let msg;
  if(/iPhone|iPad|iPod/i.test(ua))
    msg="📱 No iPhone/iPad (Safari):\n1. Toque no botão Compartilhar (o quadrado com a seta ↑).\n2. Escolha “Adicionar à Tela de Início”.\n3. Toque em “Adicionar”. Pronto — o app fica com ícone próprio!";
  else if(/Android/i.test(ua))
    msg="📱 No Android (Chrome):\n1. Toque no menu (⋮) no canto superior.\n2. Escolha “Instalar app” ou “Adicionar à tela inicial”.\n3. Confirme. O app aparece na sua tela inicial!";
  else
    msg="💻 No computador (Chrome/Edge):\n1. Clique no ícone de instalar (⊕ ou um monitor) na barra de endereço, à direita.\n2. Ou abra o menu (⋮) → “Instalar Aprovado 800+”.\n\nDica: você também pode salvar o arquivo .html que enviei e abri-lo offline quando quiser.";
  alert(msg);
});

render("dash");
