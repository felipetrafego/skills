# Serviços de apoio para desenvolvimento local (Postgres + Redis).
# Uso: docker compose up -d
services:
  postgres:
    image: postgres:16-alpine
    container_name: motora-postgres
    environment:
      POSTGRES_USER: motora
      POSTGRES_PASSWORD: motora
      POSTGRES_DB: motora
    ports:
      - "5432:5432"
    volumes:
      - motora-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U motora"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: motora-redis
    ports:
      - "6379:6379"
    volumes:
      - motora-redis:/data

volumes:
  motora-pg:
  motora-redis:
